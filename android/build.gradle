buildscript {
    ext.kotlin_version = '2.2.0'  // Update this line
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        //classpath 'com.android.tools.build:gradle:7.2.2'
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.4'


    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
    }
}


rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    plugins.withId('com.android.library') {
        if (!android.hasProperty('namespace') || android.namespace == null) {
            if (project.name == 'flutter_app_badger') {
                android.namespace = 'fr.g123k.flutterappbadge.flutterappbadger'
            } else if (project.group) {
                android.namespace = project.group
            } else {
                android.namespace = "com.example.${project.name.replaceAll('-', '_')}"
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
